general {
    ignore_dbus_inhibit = true
}

listener {
    timeout = 10
    on-timeout = swaylock -f --image /home/pc120/.config/hypr/1.jpg --clock --indicator --indicator-radius 100 --indicator-thickness 7
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = systemctl suspend
}

